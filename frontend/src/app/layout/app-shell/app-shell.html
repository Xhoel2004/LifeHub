<div class="shell">
  <aside class="sidebar" [class.open]="mobileNavOpen()">
    <a class="brand" routerLink="/dashboard" (click)="closeMobileNav()">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">LifeHub</span>
    </a>

    <nav class="nav-main" aria-label="Main navigation">
      @for (item of mainNav; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="active"
          (click)="closeMobileNav()"
          [style.--dot]="item.color"
        >
          <span class="nav-dot"></span>
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="nav-divider" aria-hidden="true"></div>

    <nav class="nav-secondary" aria-label="Secondary navigation">
      @for (item of secondaryNav; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="active"
          (click)="closeMobileNav()"
          [style.--dot]="item.color"
        >
          <span class="nav-dot"></span>
          {{ item.label }}
        </a>
      }
    </nav>

    <button type="button" class="user-chip" routerLink="/profile" (click)="closeMobileNav()">
      <span class="avatar">{{ userInitials() }}</span>
      <span class="user-info">
        <span class="user-name">{{ user()?.displayName ?? 'Loading…' }}</span>
        <span class="user-email">{{ user()?.email }}</span>
      </span>
    </button>

    <button type="button" class="logout-link" (click)="logout()">Log out</button>
  </aside>

  @if (mobileNavOpen()) {
    <button type="button" class="mobile-scrim" aria-label="Close navigation" (click)="closeMobileNav()"></button>
  }

  <div class="shell-main">
    <header class="shell-header">
      <button
        type="button"
        class="burger"
        aria-label="Toggle navigation"
        [attr.aria-expanded]="mobileNavOpen()"
        (click)="toggleMobileNav()"
      >
        <span></span><span></span><span></span>
      </button>
      <div class="heading">
        @if (pageCrumb()) {
          <div class="crumb">{{ pageCrumb() }}</div>
        }
        <h1>{{ pageTitle() }}</h1>
      </div>
      <div class="date-chip">{{ today }}</div>
    </header>

    <main class="content">
      <router-outlet />
    </main>

    <nav class="bottom-nav" aria-label="Main navigation">
      @for (item of mainNav; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="active" [style.--dot]="item.color">
          <span class="nav-dot"></span>
          {{ item.label }}
        </a>
      }
    </nav>
  </div>
</div>
