<header class="top-bar">
  <a class="brand" routerLink="/dashboard">
    <span class="brand-mark"></span>
    <h1>LifeHub</h1>
  </a>

  <nav class="nav-links">
    <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
    <a routerLink="/board" routerLinkActive="active">Board</a>
    <a routerLink="/budget" routerLinkActive="active">Budget</a>
  </nav>

  <div class="user-chip">
    @if (user(); as u) {
      <div class="avatar">{{ u.displayName.charAt(0).toUpperCase() }}</div>
      <span class="user-name">{{ u.displayName }}</span>
    }
    <button type="button" class="logout-btn" (click)="logout()">Log out</button>
  </div>
</header>
