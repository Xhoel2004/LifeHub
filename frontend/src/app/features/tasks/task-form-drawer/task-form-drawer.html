<div class="backdrop" (click)="cancelled.emit()">
  <aside class="drawer glass-panel" (click)="$event.stopPropagation()">
    <header class="drawer-header">
      <h2>{{ isEditMode() ? 'Edit task' : 'New task' }}</h2>
      <button type="button" class="close-btn" (click)="cancelled.emit()" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 6 6 18M6 6l12 12" stroke-linecap="round" />
        </svg>
      </button>
    </header>

    <form [formGroup]="form" (ngSubmit)="submit()" class="drawer-form">
      <label for="title">Title</label>
      <input id="title" type="text" formControlName="title" placeholder="What needs doing?" autocomplete="off" />
      @if (form.controls.title.invalid && form.controls.title.touched) {
        <p class="field-error">Title is required.</p>
      }

      <label for="description">Description</label>
      <textarea
        id="description"
        formControlName="description"
        rows="3"
        placeholder="Add more detail (optional)"
      ></textarea>

      <div class="field-row">
        <div class="field-col">
          <label for="status">Status</label>
          <select id="status" formControlName="status">
            <option value="TODO">To do</option>
            <option value="IN_PROGRESS">In progress</option>
            <option value="DONE">Done</option>
          </select>
        </div>

        <div class="field-col">
          <label for="priority">Priority</label>
          <select id="priority" formControlName="priority">
            <option value="LOW">Low</option>
            <option value="MEDIUM">Medium</option>
            <option value="HIGH">High</option>
          </select>
        </div>
      </div>

      <label for="dueDate">Due date</label>
      <input id="dueDate" type="date" formControlName="dueDate" />

      <div class="drawer-actions">
        <button type="button" class="btn-ghost" (click)="cancelled.emit()">Cancel</button>
        <button type="submit" class="btn-gradient" [disabled]="submitting()">
          {{ submitting() ? 'Saving…' : isEditMode() ? 'Save changes' : 'Create task' }}
        </button>
      </div>
    </form>
  </aside>
</div>
