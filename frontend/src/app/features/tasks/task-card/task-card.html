<div class="card" [class]="'priority-' + task().priority.toLowerCase()">
  <div class="card-top">
    <span class="priority-pill" [class]="'priority-' + task().priority.toLowerCase()">
      {{ priorityLabel() }}
    </span>
    <div class="card-actions">
      <button type="button" class="icon-btn" (click)="edit.emit()" aria-label="Edit task">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 20h9" stroke-linecap="round" />
          <path
            d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
      <button type="button" class="icon-btn danger" (click)="deleteRequested.emit()" aria-label="Delete task">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 6h18" stroke-linecap="round" />
          <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" stroke-linecap="round" stroke-linejoin="round" />
          <path
            d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
    </div>
  </div>

  <h4 class="card-title">{{ task().title }}</h4>

  @if (task().description && !hideDescription()) {
    <p class="card-description">{{ task().description }}</p>
  }

  @if (dueInfo(); as due) {
    <span class="due-chip" [class.overdue]="due.overdue">
      {{ due.text }}
    </span>
  }
</div>
