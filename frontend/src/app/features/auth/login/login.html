<app-auth-shell mode="login" [errorMessage]="errorMessage()">
  <form [formGroup]="form" (ngSubmit)="submit()" class="auth-fields">
    <label for="email">Email</label>
    <input id="email" type="email" formControlName="email" autocomplete="email" placeholder="you@example.com" />
    @if (form.controls.email.invalid && form.controls.email.touched) {
      <p class="field-error">Enter a valid email address.</p>
    }

    <label for="password">Password</label>
    <input
      id="password"
      type="password"
      formControlName="password"
      autocomplete="current-password"
      placeholder="••••••••"
    />
    @if (form.controls.password.invalid && form.controls.password.touched) {
      <p class="field-error">Password is required.</p>
    }

    <button type="submit" class="btn-gradient submit-btn" [disabled]="submitting()">
      {{ submitting() ? 'Signing in…' : 'Sign in' }}
    </button>

    <p class="switch-link">New around here? <a routerLink="/register">Create an account</a></p>
  </form>
</app-auth-shell>
