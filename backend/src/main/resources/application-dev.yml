spring:
  datasource:
    url: jdbc:mysql://localhost:3306/lifehub
    username: ${MYSQL_USER:lifehub}
    password: ${MYSQL_PASSWORD:lifehub_dev_password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

# jwt.secret intentionally has NO default/fallback value here: it must come from the
# JWT_SECRET environment variable. If it's unset, startup fails with a clear error
# (either Spring's placeholder-resolution error, or JwtService's own validation message).
jwt:
  secret: ${JWT_SECRET}
  expiration-minutes: 30

logging:
  level:
    org.springframework.security: INFO
