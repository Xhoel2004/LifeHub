services:
  mysql:
    image: mysql:8.4
    container_name: lifehub-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lifehub}
      MYSQL_USER: ${MYSQL_USER:-lifehub}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-lifehub_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
